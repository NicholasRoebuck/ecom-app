<div class="main-content">

  <div class="intro">
    <p class="eyebrow">Premear</p>
    <h1>Hearing and Vision</h1>
    <p class="sub">Choose a department.</p>
  </div>

  <div class="split">

    <a class="panel panel--hearing" [routerLink]="hearingDepartment ? ['/category', hearingDepartment.id] : null" [queryParams]="{ includeDescendants: true }" [state]="{ scrollToTop: true }" aria-label="Hearing services">

      <div class="panel-copy">
        <div class="panel-label">
          <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="#f4f2ec" stroke-width="1.6">
            <path d="M4 12a8 8 0 0 1 16 0v5a3 3 0 0 1-3 3h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h4"/>
            <path d="M4 12v3a3 3 0 0 0 3 3"/>
          </svg>
          <h2>Hearing</h2>
        </div>
        <p>Hearing tests, hearing aid fittings, and routine checkups.</p>
        <span class="panel-cta">
          Explore hearing care
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <a class="panel panel--vision" [routerLink]="visionDepartment ? ['/category', visionDepartment.id] : null" [queryParams]="{ includeDescendants: true }" [state]="{ scrollToTop: true }" aria-label="Vision services">
      <img src="/assets/images/pilla-logo.jpg" alt="Pilla Performance Eyewear" class="vision-brand-image">
      <img src="/assets/images/pilla-x6-transparent.png" alt="Pilla X6 shooting glasses with a pink lens" class="vision-product-image" width="1536" height="1024">
      <div class="panel-copy"><div class="panel-label"><h2>Vision</h2></div><p>Performance eyewear. Pilla frames and lenses.</p><span class="panel-cta">Explore eyewear <span aria-hidden="true">&#8594;</span></span></div>
    </a>

  </div>
</div>
