# Disposable owner preview. The dedicated H2 DataSource never connects to MySQL.
server.port=${PORT:10000}
server.address=0.0.0.0
server.ssl.enabled=false
server.forward-headers-strategy=framework
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=ANNOTATED
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-mbfst8h6cbnd24n3.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:http://localhost:8080}
app.owner.issuer=${AUTH0_ISSUER:https://dev-mbfst8h6cbnd24n3.us.auth0.com/}
app.owner.subject=${OWNER_SUBJECT:}
stripe.key.secret=${STRIPE_TEST_SECRET_KEY:disabled-render-preview}
stripe.webhook.secret=${STRIPE_TEST_WEBHOOK_SECRET:}
allowed.origins=${PREVIEW_ORIGIN:https://example.invalid}
checkout.reconciliation.enabled=true
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
debug=false
