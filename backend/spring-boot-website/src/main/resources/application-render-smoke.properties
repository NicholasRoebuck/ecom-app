# Disposable Render capacity check. No real database or payment credentials.
server.port=${PORT:10000}
server.address=0.0.0.0
server.ssl.enabled=false
server.forward-headers-strategy=framework
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=ANNOTATED
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
checkout.reconciliation.enabled=false
stripe.key.secret=disabled-render-smoke
stripe.webhook.secret=
app.owner.issuer=
app.owner.subject=
allowed.origins=https://example.invalid
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
