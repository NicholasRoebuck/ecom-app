<div class="main-content product-list-page">
    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <div class="product-grid">
                <article *ngFor="let product of products" class="product-card">
                    <a routerLink="/products/{{ product.id }}" class="product-image-link">
                        <img src="{{ displayVariant(product)?.imageUrl }}"
                             alt="{{ product.name }}"
                             class="product-image">
                    </a>

                    <div class="product-card-content">
                        <a routerLink="/products/{{ product.id }}" class="product-name-link">
                            <h2 class="product-name">{{ product.name }}</h2>
                        </a>

                        <div class="product-price">
                            {{ displayVariant(product)?.unitPrice | currency:'USD' }}
                        </div>

                        <button (click)="addToCart(product)" class="product-add-button">
                            Add to cart
                        </button>
                    </div>
                </article>

                <div *ngIf="products.length === 0" class="empty-products">
                    No products found ...
                </div>
            </div>

            <div class="product-list-pagination">
                <ngb-pagination [(page)]="pageNumber"
                                [pageSize]="pageSize"
                                [maxSize]="5"
                                [boundaryLinks]="true"
                                [collectionSize]="totalElements"
                                (pageChange)="listProduct()">
                </ngb-pagination>

                <label class="page-size-control">
                    <span>Page size</span>
                    <select #pageSelect [value]="pageSize" (change)="updatePageSize(pageSelect.value)">
                        <option>2</option>
                        <option>5</option>
                        <option>10</option>
                        <option>20</option>
                        <option>50</option>
                    </select>
                </label>
            </div>
        </div>
    </div>
</div>
