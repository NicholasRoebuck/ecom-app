<div class="login-status-header">
  <button *ngIf="!isAuthenticated" type="button" (click)="login()" class="pill-button">Login</button>
  <ng-container *ngIf="isAuthenticated">
    <button type="button" class="account-toggle" aria-label="Account options" [attr.aria-expanded]="accountOpen" aria-controls="account-links" (click)="accountOpen = !accountOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>
      </svg>
    </button>
    <div id="account-links" class="account-links" [class.is-open]="accountOpen">
      <div class="login-status-user-info" [title]="userEmail || ''">{{ userEmail }}</div>
      <button type="button" routerLink="/members" (click)="closeAccount()" class="account-link">Member</button>
      <button type="button" routerLink="/order-history" (click)="closeAccount()" class="account-link">Orders</button>
      <button *ngIf="ownerAccess.isOwner$ | async" type="button" routerLink="/admin" (click)="closeAccount()" class="account-link">Admin</button>
      <button type="button" (click)="closeAccount(); logout()" class="account-link account-logout">Logout</button>
    </div>
  </ng-container>
</div>
