<div class="main-content">
    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <h3>Your Orders</h3>
            <p *ngIf="loading" role="status">Loading your orders...</p>
            <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }} <button type="button" (click)="handleOrderHistory()">Retry</button></div>

            <div *ngIf="!loading && !error && orderHistoryList.length > 0">
                <table class="table table-bordered">
                    <tr>
                        <th width="20%">Order tracking Number</th>
                        <th width="10%">Total Price</th>
                        <th width="10%">Total Quantity</th>
                        <th width="10%">Date</th>
                    </tr>
                    <tr *ngFor="let order of orderHistoryList">
                        <td>
                            {{ order.orderTrackingNumber }}
                        </td>
                        <td>
                            {{ order.totalPrice | currency: 'USD' }}
                        </td>
                        <td>
                            {{ order.totalQuantity }}
                        </td>
                        <td>
                            {{ order.dateCreated | date: 'medium' }}
                        </td>
                    </tr>
                </table>
            </div>

            <ngb-pagination *ngIf="!loading && !error && totalElements > pageSize" [(page)]="pageNumber" [pageSize]="pageSize" [collectionSize]="totalElements" [maxSize]="5" (pageChange)="handleOrderHistory()"></ngb-pagination>

            <!-- if the order history is empty user sees this message-->
             <div *ngIf="!loading && !error && orderHistoryList.length == 0" class="alert alert-warning col-md-12">
                No orders found.
             </div>
        </div>
    </div>
</div>
