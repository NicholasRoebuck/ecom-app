<div class="nav-menu flex items-center gap-6">

  <!-- Department toggle -->
  <div class="department-toggle flex gap-1 border-r border-gray-500 pr-4">
    <a *ngFor="let dept of departments"
       (click)="selectDepartment(dept)"
       class="square-shadow-control cursor-pointer px-3 py-1 rounded-full text-base font-medium whitespace-nowrap transition-colors no-underline"
       [class.bg-black]="activeDepartment?.id === dept.id"
       [class.text-white]="activeDepartment?.id === dept.id"
       [class.bg-gray-200]="activeDepartment?.id !== dept.id"
       [class.text-gray-700]="activeDepartment?.id !== dept.id">
      {{ dept.categoryName }}
    </a>
  </div>

<!-- Level 1 categories, inline in the same row -->
  <div class="level1-item relative"
     *ngFor="let cat of level1Categories"
     (mouseenter)="onCategoryHoverEnter(cat)"
     (mouseleave)="onCategoryHoverLeave()">
  <a routerLink="category/{{ cat.id }}"
     routerLinkActive="font-semibold"
     class="flex items-center gap-1 cursor-pointer text-lg text-black hover:text-gray-700 whitespace-nowrap transition-colors no-underline">
    {{ cat.categoryName }}
    <span *ngIf="cat.hasChildren" class="caret text-xs">▾</span>
  </a>

  <div class="nav-dropdown absolute top-full left-0 bg-white shadow-lg rounded-md py-2 min-w-[160px] z-50"
       *ngIf="expandedCategoryId === cat.id">
    <a *ngFor="let child of expandedChildren"
       routerLink="category/{{ child.id }}"
       routerLinkActive="font-semibold"
       class="block px-4 py-2 text-base text-black hover:bg-gray-100 hover:text-black no-underline">
      {{ child.categoryName }}
    </a>
  </div>
</div>
